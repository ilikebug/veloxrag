[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "veloxrag"
version = "0.1.0"
description = "VeloxRAG — a local RAG service that acts as memory for coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "cryptography==46.0.5",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "mcp==2.0.0",
  "minio==7.2.20",
  "prometheus-client==0.24.1",
  "psycopg[binary,pool]==3.3.4",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.22",
  "qdrant-client==1.17.1",
  "redis==8.0.1",
  "sqlalchemy[asyncio]==2.0.51",
  "urllib3==2.7.0",
  "uvicorn[standard]==0.51.0",
]

[project.scripts]
velox-admin = "rag_service.admin.cli:main"
velox-worker = "rag_service.jobs.worker:main"
velox-worker-health = "rag_service.jobs.worker:health_main"
velox-provider-stub = "rag_service.dev.provider_stub:main"
velox-provider-stub-tls = "rag_service.dev.provider_stub_tls:main"
velox-minio-init = "rag_service.dev.minio_init:main"
velox-chat-transcripts = "rag_service.dev.chat_transcripts:main"
velox-mcp = "rag_service.mcp.server:main"
velox-bootstrap = "rag_service.dev.bootstrap:main"

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
  "testcontainers[postgres]==4.14.2",
  "trustme==1.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_service"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "acceptance: focused end-to-end ingestion and retrieval acceptance coverage",
  "integration: requires Docker and external service containers",
]

[tool.coverage.run]
branch = true
source = ["rag_service"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["minio.*", "testcontainers.*"]
ignore_missing_imports = true
