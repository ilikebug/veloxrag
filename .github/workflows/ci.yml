name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          uv-version: 0.11.20
          enable-cache: true
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: uv sync --frozen
      - run: make check
      - run: make test
      - run: make test-integration
      - run: make coverage
      - run: make compose-config
      - run: docker build --platform linux/arm64 -t rag-service:ci .
      - run: make up-provider
      - run: make smoke
      - if: always()
        run: make down
